<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Onelight Ebook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>

    <div class="login-container">
        
        <!-- ฝั่งซ้าย -->
        <div class="left-side">
            <div class="logo-area">
                <img src="pic/logo.png" alt="Logo" style="width: 50px; height: 50px; margin-right: 10px;">
                <div>
                    <h1>Onelight</h1>
                    <p>Ebook online shop</p>
                </div>
            </div>
            <div class="quote">
                "Ignite your imagination,<br>
                one book at a time."
            </div>
        </div>

        <!-- ฝั่งขวา -->
        <div class="right-side">
            <div class="login-box">
                <div class="login-title">Create account</div>
                
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="Username">
                </div>
                <div class="input-group">
                    <input type="password" class="input-field" placeholder="Password">
                </div>
                
                <!-- ช่องกรอกวันเกิดแบบ Dropdown เลือกค่า -->
                <div class="dob-group">
                <!-- เลือกวัน (Date) -->
                    <select name="dob_date" class="dob-select">
                        <option value="" disabled selected>Date</option>
                        <option value="01">1</option>
                        <option value="02">2</option>
                        <option value="03">3</option>
                        <!-- (เดี๋ยวตอนเขียนโปรแกรมจริงๆ เราจะใช้ JavaScript หรือ PHP วนลูปเลข 1-31 ให้ครับ ตอนนี้ใส่โครงไว้ก่อน) -->
                        <option value="31">31</option>
                    </select>
                <!-- เลือกเดือน (Month) -->
                    <select name="dob_month" class="dob-select">
                        <option value="" disabled selected>Month</option>
                        <option value="01">Jan</option>
                        <option value="02">Feb</option>
                        <option value="03">Mar</option>
                        <option value="04">Apr</option>
                        <option value="05">May</option>
                        <option value="06">Jun</option>
                        <option value="07">Jul</option>
                        <option value="08">Aug</option>
                        <option value="09">Sep</option>
                        <option value="10">Oct</option>
                        <option value="11">Nov</option>
                        <option value="12">Dec</option>
                    </select>
                <!-- เลือกปี (Year) -->
                    <select name="dob_year" class="dob-select">
                        <option value="" disabled selected>Year</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <!-- (เช่นเดียวกัน สามารถใช้ลูปสร้างเลขปีถอยหลังไป 100 ปีได้ในภายหลัง) -->
                        <option value="2000">2000</option>
                    </select>
                </div>

                <!-- ปุ่มเชื่อมไปหน้า Home ชั่วคราว -->
                <a href="login.html">
                    <button class="btn-login">Sign up</button>
                </a>
                
                <!-- ลิงก์กลับไปหน้า Login -->
                <div class="signup-text">
                    Already have an account? <a href="login.html" class="signup-link">Login</a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>

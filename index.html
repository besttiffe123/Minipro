<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onelight Ebook online shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- แถบด้านบน -->
    <div class="topbar">
        <div class="logo-area">
            <img src="pic/logo.png" alt="Logo" style="width: 50px; height: 50px; margin-right: 10px;">
            <div>
                <h1>Onelight</h1>
                <p>Ebook online shop</p>
            </div>
        </div>
        <div class="search-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="color: #8b1c85;"></i>
                <input type="text" placeholder="Search">
                <i class="fa-solid fa-circle-chevron-down" id="dropdownIcon" style="color: #8b1c85; cursor: pointer;"></i>
            </div>

        <!-- เมนู Dropdown ที่ซ่อนอยู่ -->
            <div class="search-dropdown" id="searchDropdown">
                <div class="dropdown-section">
                    <div class="dropdown-header">Type</div>
                    <ul class="dropdown-list">
                        <li><a href="#">Novel</a></li>
                        <li><a href="#">Comic</a></li>
                        <li><a href="#">Manga</a></li>
                        <li><a href="#">Artbook</a></li>
                    </ul>
                </div>

                <hr class="dropdown-divider">

                <div class="dropdown-section">
                    <div class="dropdown-header">Genres</div>
                    <ul class="dropdown-list">
                        <li><a href="#">Action</a></li>
                        <li><a href="#">Sci-fi</a></li>
                        <li><a href="#">Fantasy</a></li>
                        <li><a href="#">Romance</a></li>
                        <li><a href="#">Thriller</a></li>
                        <li><a href="#">Horror</a></li>
                    </ul>
                </div>
            </div>    
        </div>
    </div>

    <div class="main-container">
        <!-- เมนูด้านซ้าย -->
        <div class="sidebar">
            <a href="index.html">
                <i class="fa-solid fa-house active"></i>
            </a>
            <a href="library.html">
                <i class="fa-solid fa-bookmark"></i>
            </a>
            <a href="profile.html">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>

        <!-- เนื้อหาหลัก -->
        <div class="content">
            <!-- หมวดหมู่ Newly releases -->
            <div class="section-header">
                Newly releases <i class="fa-solid fa-caret-down"></i>
            </div>
            <div class="book-grid">
                <div class="book-card">
                    <div class="book-cover"></div>
                    <div class="book-title">Book1</div>
                    <div class="book-price">0.00B</div>
                </div>
                <div class="book-card">
                    <div class="book-cover"></div>
                    <div class="book-title">Book2</div>
                    <div class="book-price">0.00B</div>
                </div>
                <div class="book-card">
                    <div class="book-cover"></div>
                    <div class="book-title">Book3</div>
                    <div class="book-price">0.00B</div>
                </div>
                <div class="book-card">
                    <div class="book-cover"></div>
                    <div class="book-title">Book4</div>
                    <div class="book-price">0.00B</div>
                </div>
            </div>

            <!-- หมวดหมู่ Trending -->
            <div class="section-header" style="margin-top: 20px;">
                Trending <i class="fa-solid fa-caret-down"></i>
            </div>
            <div class="book-grid">
                <div class="book-card">
                    <div class="book-cover"></div>
                    <div class="book-title">Book1</div>
                    <div class="book-price">0.00B</div>
                </div>
                <div class="book-card">
                    <div class="book-cover"></div>
                    <div class="book-title">Book2</div>
                    <div class="book-price">0.00B</div>
                </div>
                <div class="book-card">
                    <div class="book-cover"></div>
                    <div class="book-title">Book3</div>
                    <div class="book-price">0.00B</div>
                </div>
                <div class="book-card">
                    <div class="book-cover"></div>
                    <div class="book-title">Book4</div>
                    <div class="book-price">0.00B</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ปุ่มตะกร้า -->
    <div class="floating-cart">
        <i class="fa-solid fa-cart-shopping"></i>
    </div>

    <script>
    const dropdownIcon = document.getElementById('dropdownIcon');
    const searchDropdown = document.getElementById('searchDropdown');

    // เมื่อคลิกที่ไอคอนลูกศร
    dropdownIcon.addEventListener('click', function(event) {
        event.stopPropagation(); // ป้องกันไม่ให้คลิกทะลุไปโดนส่วนอื่น
        searchDropdown.classList.toggle('show');
        
        // สลับไอคอนชี้ลง/ชี้ขึ้น
        if (searchDropdown.classList.contains('show')) {
            dropdownIcon.classList.remove('fa-circle-chevron-down');
            dropdownIcon.classList.add('fa-circle-chevron-up');
        } else {
            dropdownIcon.classList.remove('fa-circle-chevron-up');
            dropdownIcon.classList.add('fa-circle-chevron-down');
        }
    });

    // ปิดเมนูอัตโนมัติหากผู้ใช้คลิกพื้นที่อื่นบนหน้าเว็บ
    window.addEventListener('click', function(event) {
        if (!document.querySelector('.search-container').contains(event.target)) {
            searchDropdown.classList.remove('show');
            dropdownIcon.classList.remove('fa-circle-chevron-up');
            dropdownIcon.classList.add('fa-circle-chevron-down');
        }
    });
</script>
</body>
</html>

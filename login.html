<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Onelight Ebook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>

    <div class="login-container">
        
        <!-- ฝั่งซ้าย -->
        <div class="left-side">
            <div class="logo-area">
                <img src="pic/logo.png" alt="Logo" style="width: 50px; height: 50px; margin-right: 10px;">
                <div>
                    <h1>Onelight</h1>
                    <p>Ebook online shop</p>
                </div>
            </div>
            <div class="quote">
                "Ignite your imagination,<br>
                one book at a time."
            </div>
        </div>
         <!-- ฝั่งขวา -->
        <div class="right-side">
            <div class="login-box">
                <div class="login-title">Login</div>
                
                <!-- ฟอร์มกรอกข้อมูล -->
                <!-- หมายเหตุ: ใส่ href ไปหน้า index.html ชั่วคราว เมื่อทำระบบ Backend ค่อยเปลี่ยนเป็นแท็ก <form action="login.php"> -->
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="Username">
                </div>
                <div class="input-group">
                    <input type="password" class="input-field" placeholder="Password">
                </div>
                
                <!-- ปุ่มกดไปหน้าแรกชั่วคราว -->
                <a href="index.html">
                    <button class="btn-login">Login</button>
                </a>
                
                <div class="signup-text">
                    Don't have account yet? <a href="Signin.html" class="signup-link">Sign up</a>
                </div>
            </div>
        </div>

    </div>

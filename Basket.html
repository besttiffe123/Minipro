<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Basket - Onelight Ebook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- แถบด้านบน -->
    <div class="topbar">
        <div class="logo-area">
            <img src="pic/logo.png" alt="Logo" style="width: 50px; height: 50px; margin-right: 10px;">
            <div>
                <h1>Onelight</h1>
                <p>Ebook online shop</p>
            </div>
        </div>
        <div class="search-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="color: #8b1c85;"></i>
                <input type="text" placeholder="Search">
                <i class="fa-solid fa-circle-chevron-down" id="dropdownIcon" style="color: #8b1c85; cursor: pointer;"></i>
            </div>

        <!-- เมนู Dropdown ที่ซ่อนอยู่ -->
            <div class="search-dropdown" id="searchDropdown">
                <div class="dropdown-section">
                    <div class="dropdown-header">Type</div>
                    <ul class="dropdown-list">
                        <li><a href="Novel.html">Novel</a></li>
                        <li><a href="Comic.html">Comic</a></li>
                        <li><a href="Manga.html">Manga</a></li>
                        <li><a href="Artbook.html">Artbook</a></li>
                    </ul>
                </div>

                <hr class="dropdown-divider">

                <div class="dropdown-section">
                    <div class="dropdown-header">Genres</div>
                    <ul class="dropdown-list">
                        <li><a href="Action.html">Action</a></li>
                        <li><a href="Sci-fi.html">Sci-fi</a></li>
                        <li><a href="Fantasy.html">Fantasy</a></li>
                        <li><a href="Romance.html">Romance</a></li>
                        <li><a href="Thriller.html">Thriller</a></li>
                        <li><a href="Horror.html">Horror</a></li>
                    </ul>
                </div>
            </div>    
        </div>
    </div>

        <!-- เนื้อหาหลัก -->
        <div class="main-container">
        <!-- เมนูด้านซ้าย -->
        <div class="sidebar">
            <a href="index.html">
                <i class="fa-solid fa-house active"></i>
            </a>
            <a href="library.html">
                <i class="fa-solid fa-bookmark"></i>
            </a>
            <a href="profile.html">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>

        <!-- เนื้อหาหลัก -->
        <div class="content">
            
            <!-- หัวข้อหน้าตะกร้า -->
            <div class="basket-title-area">
                <a href="index.html" class="back-arrow"><i class="fa-solid fa-arrow-left"></i></a>
                <h2>Your Basket</h2>
            </div>

            <!-- แถบแสดงขั้นตอน (Stepper) -->
            <div class="stepper-container">
                <div class="step active">
                    <div class="step-circle">1</div>
                    <div class="step-label">Basket</div>
                </div>
                <i class="fa-solid fa-arrow-right step-arrow"></i>
                <div class="step">
                    <div class="step-circle">2</div>
                    <div class="step-label">Confirm Payment</div>
                </div>
                <i class="fa-solid fa-arrow-right step-arrow"></i>
                <div class="step">
                    <div class="step-circle">3</div>
                    <div class="step-label">Completed</div>
                </div>
            </div>

            <!-- ส่วนรายการสินค้า -->
            <div class="cart-items-wrapper">
                <!-- Checkbox เลือกทั้งหมด -->
                <div class="select-all-box">
                    <input type="checkbox" id="selectAll">
                    <label for="selectAll">Select all</label>
                </div>

                <!-- การ์ดรายการหนังสือในตะกร้า -->
                <div class="cart-item">
                    <input type="checkbox" class="item-checkbox">
                    <div class="cart-cover"></div>
                    <div class="cart-item-info">
                        <div class="cart-item-title">Book1</div>
                        <div class="cart-item-price">0.00B</div>
                    </div>
                    <!-- ปุ่มลบสินค้า (ไอคอนถังขยะ) -->
                    <button class="btn-delete-item">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- ส่วนสรุปราคารวมและปุ่ม Pay Now ด้านขวาล่าง -->
                <div class="cart-summary-bar">
                    <div class="total-price-text">
                        Total price: <span>0.00B</span>
                    </div>
                    <a href="payment.html" class="cart-summary-link">
                        <button class="btn-pay-now">Pay Now</button>
                    </a>
                </div>
        </div>
    </div>

    <script>
    const dropdownIcon = document.getElementById('dropdownIcon');
    const searchDropdown = document.getElementById('searchDropdown');

    // เมื่อคลิกที่ไอคอนลูกศร
    dropdownIcon.addEventListener('click', function(event) {
        event.stopPropagation(); // ป้องกันไม่ให้คลิกทะลุไปโดนส่วนอื่น
        searchDropdown.classList.toggle('show');
        
        // สลับไอคอนชี้ลง/ชี้ขึ้น
        if (searchDropdown.classList.contains('show')) { //  เช็กดูว่า ตอนนี้ตัวเมนูค้นหา (searchDropdown) มีคำสั่ง (Class) ที่ชื่อว่า 'show' แปะอยู่ไหม?
            dropdownIcon.classList.remove('fa-circle-chevron-down');
            dropdownIcon.classList.add('fa-circle-chevron-up');
        } else {
            dropdownIcon.classList.remove('fa-circle-chevron-up');
            dropdownIcon.classList.add('fa-circle-chevron-down');
        }
    });

    // ปิดเมนูอัตโนมัติหากผู้ใช้คลิกพื้นที่อื่นบนหน้าเว็บ
    window.addEventListener('click', function(event) {
        if (!document.querySelector('.search-container').contains(event.target)) {
            searchDropdown.classList.remove('show');
            dropdownIcon.classList.remove('fa-circle-chevron-up');
            dropdownIcon.classList.add('fa-circle-chevron-down');
        }
    });

    // 1. ระบบ Select All (เลือก / ไม่เลือก ทั้งหมด)
    const selectAll = document.getElementById('selectAll');
    const itemCheckboxes = document.querySelectorAll('.item-checkbox');

    if (selectAll) {
        // เมื่อคลิกที่ Checkbox "Select all"
        selectAll.addEventListener('change', function () {
            itemCheckboxes.forEach(checkbox => {
                checkbox.checked = selectAll.checked;
            });
        });

        // เมื่อคลิก Checkbox ย่อยแต่ละอัน ให้เช็คว่าเลือกครบทุกอันหรือยัง
        itemCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', function () {
                const allChecked = Array.from(itemCheckboxes).every(cb => cb.checked);
                selectAll.checked = allChecked;
            });
        });
    }

    // 2. ระบบกดปุ่มถังขยะเพื่อลบรายการสินค้า
    const deleteButtons = document.querySelectorAll('.btn-delete-item');

    deleteButtons.forEach(button => {
        button.addEventListener('click', function () {
            // ค้นหากล่องการ์ดสินค้า (.cart-item) ที่ปุ่มถังขยะนี้สังกัดอยู่ แล้วทำการลบออก
            const cartItem = button.closest('.cart-item');
            if (cartItem) {
                cartItem.remove();
            }
        });
    });
</script>
</body>
</html>
